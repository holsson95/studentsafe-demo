services:
  - type: web
    name: studentsafe-demo
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALMA_KEY
        value: unused-in-demo-mode
      - key: ALMA_SECRET
        value: unused-in-demo-mode
      - key: CUSTOM_FIELD_API_NATIONALITY
        value: ""
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: APP_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false

  - type: web
    name: studentsafe-demo-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
